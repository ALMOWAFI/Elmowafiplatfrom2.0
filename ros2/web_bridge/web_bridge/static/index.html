<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ليلة المافيا · Mafia Night</title>
<style>
  :root { --bg:#12121a; --card:#1e1e2c; --ink:#f2f2f7; --dim:#9a9ab0;
          --accent:#e0533d; --ok:#3dbd6e; --warn:#e0b13d; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,'Segoe UI',sans-serif;
         min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center;
           padding:12px 16px; border-bottom:1px solid #2a2a3a; }
  header h1 { font-size:1.1rem; }
  #langBtn { background:none; border:1px solid var(--dim); color:var(--dim);
             border-radius:8px; padding:4px 10px; font-size:.9rem; }
  main { flex:1; padding:16px; max-width:480px; width:100%; margin:0 auto; }
  .card { background:var(--card); border-radius:16px; padding:20px; margin-bottom:14px; }
  .big { font-size:1.35rem; font-weight:700; text-align:center; }
  .dim { color:var(--dim); font-size:.9rem; text-align:center; margin-top:6px; }
  input,select { width:100%; padding:14px; border-radius:10px; border:1px solid #333;
          background:#101018; color:var(--ink); font-size:1.05rem; margin-top:10px; }
  button.primary { width:100%; padding:15px; margin-top:14px; border:0; border-radius:12px;
          background:var(--accent); color:#fff; font-size:1.1rem; font-weight:700; }
  button.primary:disabled { opacity:.4; }
  .plist { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .pbtn { display:flex; align-items:center; justify-content:space-between;
          padding:13px 15px; border-radius:12px; border:1px solid #34344a;
          background:#181826; color:var(--ink); font-size:1.05rem; }
  .pbtn.dead { opacity:.35; text-decoration:line-through; }
  .pbtn.selected { border-color:var(--accent); background:#2a1c1c; }
  .role-card { text-align:center; padding:28px 20px; }
  .role-emoji { font-size:3.2rem; }
  .role-name { font-size:1.6rem; font-weight:800; margin-top:8px; }
  .log { font-size:.92rem; color:var(--dim); max-height:150px; overflow-y:auto;
         display:flex; flex-direction:column-reverse; gap:6px; }
  .log .callout { color:var(--warn); font-weight:700; }
  .banner { text-align:center; padding:10px; border-radius:10px; margin-bottom:14px;
            background:#22222f; font-weight:600; }
  .hidden { display:none !important; }
  .pulse { animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
</style>
</head>
<body>
<header>
  <h1 id="title">🎭 ليلة المافيا</h1>
  <button id="langBtn" onclick="toggleLang()">EN</button>
</header>
<main>
  <div id="banner" class="banner hidden"></div>

  <!-- JOIN -->
  <section id="join" class="card">
    <div class="big" data-t="joinTitle">انضم للعبة</div>
    <input id="nameInput" data-p="namePh" placeholder="اسمك" maxlength="20">
    <button class="primary" onclick="join()" data-t="joinBtn">دخول</button>
  </section>

  <!-- LOBBY -->
  <section id="lobby" class="card hidden">
    <div class="big" data-t="lobbyTitle">في انتظار اللاعبين…</div>
    <div class="plist" id="lobbyList"></div>
    <div id="hostBox" class="hidden">
      <select id="mafiaCount"></select>
      <button class="primary" onclick="startGame()" data-t="startBtn">ابدأ اللعبة</button>
    </div>
  </section>

  <!-- ROLE -->
  <section id="roleCard" class="card role-card hidden" onclick="this.classList.toggle('revealed')">
    <div class="role-emoji" id="roleEmoji">🂠</div>
    <div class="role-name" id="roleName"></div>
    <div class="dim" id="roleHint"></div>
  </section>

  <!-- GAME -->
  <section id="game" class="card hidden">
    <div class="big" id="phaseTitle"></div>
    <div class="dim" id="phaseHint"></div>
    <div class="plist" id="targets"></div>
    <button id="actBtn" class="primary hidden" onclick="act()"></button>
  </section>

  <!-- LOG -->
  <section class="card hidden" id="logCard"><div class="log" id="log"></div></section>
</main>

<script>
const T = {
  ar: { joinTitle:'انضم للعبة', namePh:'اسمك', joinBtn:'دخول',
    lobbyTitle:'في انتظار اللاعبين…', startBtn:'ابدأ اللعبة',
    needMore:n=>`محتاجين ${n} كمان للبدء`,
    mafiaN:n=>`عدد المافيا: ${n}`,
    roles:{ mafia:['🔪','مافيا','أنت من المافيا! لا تكشف نفسك. شركاؤك:'],
            doctor:['🩺','الدكتور','كل ليلة تحمي شخصًا واحدًا'],
            detective:['🕵️','الشايب','كل ليلة تسأل عن شخص: هل هو مافيا؟'],
            civilian:['👤','مواطن','انتبه للنقاش واكتشف المافيا'] },
    phases:{ night_mafia:['🌙 المافيا تختار…','أغمض عينيك إن لم تكن مافيا'],
             night_doctor:['🌙 الدكتور يعالج…','أغمض عينيك إن لم تكن الدكتور'],
             night_detective:['🌙 الشايب يسأل…','أغمض عينيك إن لم تكن الشايب'],
             day_discussion:['☀️ وقت النقاش','اتهموا وناقشوا ثم صوّتوا'],
             day_vote:['🗳️ التصويت','اختر من تتهمه'],
             game_over:['🏁 انتهت اللعبة',''] },
    act:{ kill:'اغتيال', protect:'حماية', ask:'اسأل عنه', vote:'صوّت', beginVote:'ابدأ التصويت' },
    ev:{ night_begins:d=>`🌙 الليلة ${d.round} بدأت — الكل ينام`,
         day_begins:d=> d.death ? `☀️ صباح الخير… ${name(d.death)} قُتل الليلة 💀`
                                : (d.saved ? '☀️ صباح الخير — الدكتور أنقذ الضحية! 🩺' : '☀️ صباح الخير — لا ضحايا'),
         player_eliminated:d=>`⚖️ تم إعدام ${name(d.player)} — كان ${T.ar.roles[d.role][1]}`,
         no_elimination:()=>'⚖️ تعادل — لا إعدام اليوم',
         vote_tied:d=> d.revote ? '🔁 تعادل! إعادة التصويت بين المتعادلين' : '',
         game_over:d=> d.winner==='mafia' ? '🔪 المافيا فازت!' : '🎉 المواطنون فازوا!',
         peek_callout:d=>`🚨 ${name(d.player)} فتح عينه وهو نايم! عيب يا معلم!`,
         detective_answer:d=> d.is_mafia ? `🕵️ نعم — ${name(d.target)} مافيا!` : `🕵️ لا — ${name(d.target)} بريء`,
         mafia_chose:()=> '', doctor_done:()=> '', discussion_begins:()=> '', vote_begins:()=>'🗳️ بدأ التصويت' },
    dead:'☠️ خرجت من اللعبة — تابع بصمت', youWin:'فزت! 🎉', youLose:'خسرت 😢' },
  en: { joinTitle:'Join the game', namePh:'Your name', joinBtn:'Join',
    lobbyTitle:'Waiting for players…', startBtn:'Start game',
    needMore:n=>`Need ${n} more to start`,
    mafiaN:n=>`Mafia count: ${n}`,
    roles:{ mafia:['🔪','Mafia','You are mafia! Stay hidden. Partners:'],
            doctor:['🩺','Doctor','Each night, protect one person'],
            detective:['🕵️','Detective','Each night, ask about one person'],
            civilian:['👤','Civilian','Watch the discussion, find the mafia'] },
    phases:{ night_mafia:['🌙 Mafia is choosing…','Eyes closed unless you are mafia'],
             night_doctor:['🌙 Doctor is working…','Eyes closed unless you are the doctor'],
             night_detective:['🌙 Detective is asking…','Eyes closed unless you are the detective'],
             day_discussion:['☀️ Discussion time','Accuse, debate, then vote'],
             day_vote:['🗳️ Voting','Pick your suspect'],
             game_over:['🏁 Game over',''] },
    act:{ kill:'Assassinate', protect:'Protect', ask:'Ask', vote:'Vote', beginVote:'Start the vote' },
    ev:{ night_begins:d=>`🌙 Night ${d.round} — everyone sleeps`,
         day_begins:d=> d.death ? `☀️ Morning… ${name(d.death)} was killed 💀`
                                : (d.saved ? '☀️ Morning — the doctor saved the victim! 🩺' : '☀️ Morning — nobody died'),
         player_eliminated:d=>`⚖️ ${name(d.player)} was voted out — was ${T.en.roles[d.role][1]}`,
         no_elimination:()=>'⚖️ Tie — nobody eliminated today',
         vote_tied:d=> d.revote ? '🔁 Tie! Revote between the tied players' : '',
         game_over:d=> d.winner==='mafia' ? '🔪 Mafia wins!' : '🎉 Civilians win!',
         peek_callout:d=>`🚨 ${name(d.player)} peeked during the night! Busted!`,
         detective_answer:d=> d.is_mafia ? `🕵️ Yes — ${name(d.target)} is mafia!` : `🕵️ No — ${name(d.target)} is innocent`,
         mafia_chose:()=> '', doctor_done:()=> '', discussion_begins:()=> '', vote_begins:()=>'🗳️ Voting started' },
    dead:'☠️ You are out — watch quietly', youWin:'You win! 🎉', youLose:'You lose 😢' }
};

let lang = 'ar';
// sessionStorage: identity is per-tab (so several tabs = several players),
// but survives a refresh of the same tab
let pid = sessionStorage.getItem('pid') ||
          ('p_' + Math.random().toString(36).slice(2, 8));
sessionStorage.setItem('pid', pid);
let state = { phase:'lobby', alive_ids:[], names:{}, winner:'', host:'' };
let myRole = null, partners = [], selected = null;
const isHost = () => state.host === pid;
const joined = () => pid in state.names;

const $ = id => document.getElementById(id);
const t = () => T[lang];
const name = p => state.names[p] || p;
const alive = p => state.alive_ids.includes(p);

function toggleLang() {
  lang = lang === 'ar' ? 'en' : 'ar';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
  $('title').textContent = lang === 'ar' ? '🎭 ليلة المافيا' : '🎭 Mafia Night';
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t()[el.dataset.t]);
  document.querySelectorAll('[data-p]').forEach(el => el.placeholder = t()[el.dataset.p]);
  render();
}

async function api(action_type, target_id = '', data = null) {
  const r = await fetch('/api/action', { method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ player_id: pid, action_type, target_id, data }) });
  const out = await r.json();
  if (!out.accepted && out.message) showBanner('⚠️ ' + out.message, 2500);
  return out;
}

function connectWS() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/${pid}`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connectWS, 1500);
}

function handle(msg) {
  if (msg.type === 'state') {
    Object.assign(state, msg);
    render();
  } else if (msg.type === 'role') {
    myRole = msg.role; partners = msg.partners || [];
    render();
  } else if (msg.type === 'event') {
    const fn = t().ev[msg.event];
    const text = fn ? fn(msg.data) : '';
    if (text) addLog(text, msg.event === 'peek_callout');
    if (msg.event === 'peek_callout') showBanner(text, 4000);
    if (msg.event === 'detective_answer') showBanner(text, 6000);
  }
}

function addLog(text, callout = false) {
  const div = document.createElement('div');
  div.textContent = text;
  if (callout) div.className = 'callout';
  $('log').prepend(div);
  $('logCard').classList.remove('hidden');
}

let bannerTimer = null;
function showBanner(text, ms) {
  $('banner').textContent = text;
  $('banner').classList.remove('hidden');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => $('banner').classList.add('hidden'), ms);
}

async function join() {
  const n = $('nameInput').value.trim();
  if (!n) return;
  await api('join', '', { name: n });
  // joined/host state arrives via the state broadcast
}

async function startGame() {
  await api('start', '', { mafia_count: parseInt($('mafiaCount').value) });
}

let pendingAction = null;
async function act() {
  if (!pendingAction || !selected) return;
  const out = await api(pendingAction, selected);
  if (out.accepted) { selected = null; render(); }
}

function targetButtons(candidates, actionLabel, action) {
  const box = $('targets');
  box.innerHTML = '';
  candidates.forEach(p => {
    const b = document.createElement('button');
    b.className = 'pbtn' + (p === selected ? ' selected' : '');
    b.textContent = name(p);
    b.onclick = () => { selected = p; render(); };
    box.appendChild(b);
  });
  const btn = $('actBtn');
  if (actionLabel) {
    btn.textContent = actionLabel;
    btn.disabled = !selected;
    btn.classList.remove('hidden');
    pendingAction = action;
  } else {
    btn.classList.add('hidden');
    pendingAction = null;
  }
}

function render() {
  const inLobby = state.phase === 'lobby';
  $('join').classList.toggle('hidden', joined() || !inLobby);
  $('lobby').classList.toggle('hidden', !(joined() && inLobby));
  $('game').classList.toggle('hidden', inLobby);
  $('roleCard').classList.toggle('hidden', inLobby || !myRole);

  if (joined() && inLobby) {
    const list = $('lobbyList');
    list.innerHTML = '';
    Object.entries(state.names).forEach(([p, n]) => {
      const d = document.createElement('div');
      d.className = 'pbtn';
      d.textContent = (p === state.host ? '⭐ ' : '') + n + (p === pid ? ` (${lang==='ar'?'أنت':'you'})` : '');
      list.appendChild(d);
    });
    const count = Object.keys(state.names).length;
    $('hostBox').classList.toggle('hidden', !isHost());
    if (isHost()) {
      const sel = $('mafiaCount');
      const startBtn = $('hostBox').querySelector('button');
      if (count >= 4) {
        sel.classList.remove('hidden');
        startBtn.disabled = false;
        startBtn.textContent = t().startBtn;
        const maxM = Math.max(1, count - 3);
        sel.innerHTML = '';
        for (let i = 1; i <= maxM; i++) {
          const o = document.createElement('option');
          o.value = i; o.textContent = t().mafiaN(i);
          if (i === Math.max(1, Math.floor(count / 4))) o.selected = true;
          sel.appendChild(o);
        }
      } else {
        sel.classList.add('hidden');
        startBtn.disabled = true;
        startBtn.textContent = t().needMore(4 - count);
      }
    }
    return;
  }
  if (inLobby) return;

  if (myRole) {
    const [emoji, rname, hint] = t().roles[myRole];
    $('roleEmoji').textContent = emoji;
    $('roleName').textContent = rname;
    $('roleHint').textContent = myRole === 'mafia' && partners.length
      ? `${hint} ${partners.map(name).join('، ')}` : hint;
  }

  const ph = t().phases[state.phase] || ['', ''];
  $('phaseTitle').textContent = ph[0];
  $('phaseHint').textContent = ph[1];

  const iAmAlive = alive(pid);
  const others = state.alive_ids.filter(p => p !== pid);

  if (!iAmAlive && state.phase !== 'game_over') {
    $('phaseHint').textContent = t().dead;
    targetButtons([], null);
    return;
  }

  switch (state.phase) {
    case 'night_mafia':
      if (myRole === 'mafia') {
        $('phaseTitle').classList.add('pulse');
        targetButtons(others.filter(p => !partners.includes(p)), t().act.kill, 'kill');
      } else targetButtons([], null);
      break;
    case 'night_doctor':
      if (myRole === 'doctor') targetButtons(state.alive_ids, t().act.protect, 'protect');
      else targetButtons([], null);
      break;
    case 'night_detective':
      if (myRole === 'detective') targetButtons(others, t().act.ask, 'ask');
      else targetButtons([], null);
      break;
    case 'day_discussion':
      targetButtons([], null);
      $('actBtn').textContent = t().act.beginVote;
      $('actBtn').disabled = false;
      $('actBtn').classList.remove('hidden');
      pendingAction = null;
      $('actBtn').onclick = async () => { await api('begin_vote'); $('actBtn').onclick = act; };
      break;
    case 'day_vote':
      targetButtons(others, t().act.vote, 'vote');
      break;
    case 'game_over': {
      const iWon = (state.winner === 'mafia') === (myRole === 'mafia');
      $('phaseHint').textContent = iWon ? t().youWin : t().youLose;
      targetButtons([], null);
      break;
    }
    default:
      targetButtons([], null);
  }
}

connectWS();
render();
</script>
</body>
</html>
